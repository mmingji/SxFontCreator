<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 页签名称固定为应用品牌（决策记录 七-1）；项目名在页面内展示 -->
  <title>SxFontCreator 手写字体制作器</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <!--
    首屏加载层样式内联在这里，是**故意**的：它必须在 JS（含 Vue 与依赖）下载执行之前就能显示，
    否则用户看到的是白屏 —— 实测冷启动（重建依赖后首次访问）白屏约 3.5 秒，热启动约 0.3 秒。
    动画演示本产品的三件事：定位块 → 按已知网格切格 → 逐格识别，顺便当作加载指示。
  -->
  <style>
    #boot {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #f5f6fa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      transition: opacity 0.3s ease;
    }
    #boot.boot-done {
      opacity: 0;
      pointer-events: none;
    }
    #boot .boot-anim {
      width: 260px;
      height: 174px;
    }
    /* 网格线：先按虚线偏移"画"出来，再保持 */
    #boot .boot-grid line {
      stroke: #c9cfdb;
      stroke-width: 0.8;
      stroke-dasharray: 92;
      stroke-dashoffset: 92;
      animation: boot-draw 3.6s ease-in-out infinite;
    }
    /* 四角定位块：与真实模板同色 #2E6E7E（中深青），逐个出现 */
    #boot .boot-mark {
      fill: #2e6e7e;
      opacity: 0;
      animation: boot-mark 3.6s ease-in-out infinite;
    }
    /* 扫描线：自上而下扫过，隐喻逐格识别 */
    #boot .boot-scan {
      stroke: #3b82f6;
      stroke-width: 1.4;
      opacity: 0;
      animation: boot-scan 3.6s ease-in-out infinite;
    }
    #boot .boot-title {
      margin: 0;
      font-size: 14px;
      color: #1f2329;
    }
    #boot .boot-sub {
      margin: 0;
      font-size: 12px;
      color: #6b7280;
    }
    /* 超过 8 秒还没进主界面，多半是加载失败：给一句可操作的提示，避免用户对着动画干等 */
    #boot .boot-slow {
      margin: 0;
      font-size: 12px;
      color: #b45309;
      opacity: 0;
      animation: boot-slow 0.3s linear 8s forwards;
    }
    @keyframes boot-mark {
      0%, 8% { opacity: 0; }
      18%, 88% { opacity: 1; }
      96%, 100% { opacity: 0; }
    }
    @keyframes boot-draw {
      0%, 12% { stroke-dashoffset: 92; }
      38%, 88% { stroke-dashoffset: 0; }
      96%, 100% { stroke-dashoffset: 92; }
    }
    @keyframes boot-scan {
      0%, 34% { opacity: 0; transform: translateY(0); }
      40% { opacity: 1; }
      78% { opacity: 1; transform: translateY(60px); }
      84%, 100% { opacity: 0; transform: translateY(60px); }
    }
    @keyframes boot-slow {
      to { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      #boot .boot-mark, #boot .boot-grid line, #boot .boot-scan { animation-duration: 0.01s; animation-iteration-count: 1; }
    }
  </style>
</head>
<body>
  <div id="boot" role="status" aria-live="polite">
    <svg class="boot-anim" viewBox="0 0 120 80" fill="none" aria-hidden="true">
      <!-- 四角定位块（真实模板里的注册标记） -->
      <rect class="boot-mark" x="1" y="1" width="7" height="7" style="animation-delay: 0s" />
      <rect class="boot-mark" x="112" y="1" width="7" height="7" style="animation-delay: 0.12s" />
      <rect class="boot-mark" x="1" y="72" width="7" height="7" style="animation-delay: 0.24s" />
      <rect class="boot-mark" x="112" y="72" width="7" height="7" style="animation-delay: 0.36s" />
      <!-- 按已知网格切格：三条横线 + 五条竖线 -->
      <g class="boot-grid">
        <line x1="12" y1="14" x2="108" y2="14" style="animation-delay: 0s" />
        <line x1="12" y1="34" x2="108" y2="34" style="animation-delay: 0.12s" />
        <line x1="12" y1="54" x2="108" y2="54" style="animation-delay: 0.24s" />
        <line x1="12" y1="14" x2="12" y2="66" style="animation-delay: 0.06s" />
        <line x1="36" y1="14" x2="36" y2="66" style="animation-delay: 0.18s" />
        <line x1="60" y1="14" x2="60" y2="66" style="animation-delay: 0.3s" />
        <line x1="84" y1="14" x2="84" y2="66" style="animation-delay: 0.42s" />
        <line x1="108" y1="14" x2="108" y2="66" style="animation-delay: 0.54s" />
      </g>
      <!-- 扫描线：逐格识别 -->
      <line class="boot-scan" x1="12" y1="14" x2="108" y2="14" />
    </svg>
    <p class="boot-title">正在加载 SxFontCreator</p>
    <p class="boot-sub">首次打开需要准备字体与 PDF 组件，通常 2 至 3 秒</p>
    <p class="boot-slow">加载超过 8 秒仍未完成，请刷新页面重试</p>
  </div>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
